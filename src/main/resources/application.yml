logging:
  level:
#    ROOT: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    ga.banga.springai: DEBUG
    ga.banga.springai.tools: DEBUG


spring:
  application:
    name: spring-ai

  ai:
    ollama:
      base-url: http://10.0.156.29:11434
      chat:
        enabled: true
        options:
          model: llama3.2 #mistral
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-3-5-sonnet-latest
          temperature: 0.7
          max-tokens: 400
    retry:
      max-attempts: 10

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:springai;DB_CLOSE_DELAY=-1
    username: springai
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  h2:
    console:
      enabled: true

  sql:
    init:
      mode: always

  # Activer la création et mise à jour automatique des tables
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true  # Important : permet d'exécuter data.sql après la création des tables


